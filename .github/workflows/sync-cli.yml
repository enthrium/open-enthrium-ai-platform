name: Sync → oe-ai-agent-runtime

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  sync:
    if: github.repository == 'enthrium/enthrium-commercial'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone oe-ai-agent-runtime
        env:
          PAT: ${{ secrets.WEBSITE_PAT }}
        run: |
          git clone https://x-access-token:${PAT}@github.com/enthrium/open-enthrium-ai-agent-runtime.git /tmp/cli-repo

      - name: Sync server/ (excl. mcp/) and root files
        run: |
          rsync -avc --delete \
            --exclude='mcp/' \
            --exclude='node_modules/' \
            --exclude='storage/' \
            --exclude='.env' \
            --exclude='.env.example' \
            server/ /tmp/cli-repo/server/
          cp server/cli/README.md /tmp/cli-repo/README.md
          cp server/cli/CONTRIBUTING.md /tmp/cli-repo/CONTRIBUTING.md
          cp server/cli/LICENSE /tmp/cli-repo/LICENSE
          cp server/cli/SECURITY.md /tmp/cli-repo/SECURITY.md
          cp server/cli/CHANGELOG.md /tmp/cli-repo/CHANGELOG.md
          mkdir -p /tmp/cli-repo/.github/workflows
          cp server/cli/.github/workflows/release.yml /tmp/cli-repo/.github/workflows/release.yml

      - name: Commit, push and tag
        env:
          PAT: ${{ secrets.WEBSITE_PAT }}
          TAG: ${{ github.ref_name }}
        run: |
          cd /tmp/cli-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${PAT}@github.com/enthrium/open-enthrium-ai-agent-runtime.git
          git add -A
          git diff --cached --quiet || git commit -m "sync: ${TAG}"
          git push origin main
          git tag -f ${TAG}
          git push origin ${TAG} --force
