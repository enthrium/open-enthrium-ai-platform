name: Release OE MCP

on:
  push:
    tags:
      - "v*.*.*"

jobs:

  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Extract release notes from CHANGELOG
        run: |
          TAG="${{ github.ref_name }}"
          awk "/^## \[${TAG}\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md \
            | sed '/^[[:space:]]*$/d' > /tmp/release-notes.md
          cat /tmp/release-notes.md

      - name: Create GitHub Release with notes
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          body_path: /tmp/release-notes.md

  build-windows:
    needs: [create-release]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Download canonical node.exe for SEA
        shell: pwsh
        run: |
          $ver = node --version
          $url = "https://nodejs.org/dist/$ver/win-x64/node.exe"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\node-canonical.exe"
          echo "CANONICAL_NODE_EXE=$env:RUNNER_TEMP\node-canonical.exe" >> $env:GITHUB_ENV

      - name: Install dependencies
        working-directory: server
        run: yarn install --ignore-scripts

      - name: Build Windows MCP
        working-directory: server
        run: yarn build:mcp-win

      - name: Upload oe-mcp-win.exe
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: server/mcp/dist/oe-mcp-win.exe

  build-linux:
    needs: [create-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        working-directory: server
        run: yarn install --ignore-scripts

      - name: Build Linux MCP
        working-directory: server
        run: yarn build:mcp-linux

      - name: Zip MCP samples
        run: cd server/mcp && zip -r oe-mcp-samples.zip samples/

      - name: Upload Linux binary and samples
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            server/mcp/dist/oe-mcp-linux
            server/mcp/oe-mcp-samples.zip

  build-macos:
    needs: [create-release]
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        working-directory: server
        run: yarn install --ignore-scripts

      - name: Build macOS MCP
        working-directory: server
        run: yarn build:mcp-macos

      - name: Upload oe-mcp-macos
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: server/mcp/dist/oe-mcp-macos

  publish-npm:
    runs-on: ubuntu-latest
    needs: [build-windows, build-linux, build-macos]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Publish @openenterprise/oe-mcp to npm
        working-directory: npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  update-website:
    runs-on: ubuntu-latest
    needs: [build-windows, build-linux, build-macos]
    steps:
      - name: Clone website repo
        run: git clone https://x-access-token:${{ secrets.WEBSITE_PAT }}@github.com/enthrium/open-enterprise-website.git website

      - name: Update version in mcp.html
        run: |
          VERSION="${{ github.ref_name }}"
          cd website
          sed -i -E "s/v[0-9]+\.[0-9]+\.[0-9]+/${VERSION}/g" mcp.html

      - name: Commit and push
        run: |
          VERSION="${{ github.ref_name }}"
          cd website
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add mcp.html
          git diff --cached --quiet || git commit -m "chore: update OE MCP download links to ${VERSION}"
          git push
