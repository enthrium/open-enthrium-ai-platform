connectors:
  - name: my-gdrive
    type: gdrive
    clientId: your-google-client-id
    clientSecret: your-google-client-secret
    accessToken: ya29.your-access-token
    refreshToken: 1//your-refresh-token

# Setup:
# 1. Go to https://console.cloud.google.com
# 2. Create a project → Enable Google Drive API
# 3. OAuth consent screen → Create credentials → OAuth 2.0 Client ID
# 4. Run OAuth flow to get accessToken + refreshToken

memory:
  - key: context
    value: "Google Drive connected. Use list_files to search, read_file to read CSV/Excel."
